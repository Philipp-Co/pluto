openapi: 3.0.3
info:
  title: ''
  version: 0.0.0
paths:
  /manage/:
    get:
      operationId: manage_retrieve
      description: Returns the current state of the pluto_core process.
      tags:
      - manage
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreState'
          description: ''
        '500':
          description: No response body
    post:
      operationId: manage_create
      description: Starts the pluto_core process.
      tags:
      - manage
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          description: No response body
        '500':
          description: No response body
    delete:
      operationId: manage_destroy
      description: Stops the pluto_core process.
      tags:
      - manage
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          description: No response body
        '500':
          description: No response body
  /manage/node/:
    get:
      operationId: manage_node_retrieve
      description: Returns the current node structure including all defined nodes
        and their connections.
      tags:
      - manage
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeStructure'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeStructure'
          description: ''
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeStructure'
          description: ''
  /manage/node/add/{name}/:
    put:
      operationId: manage_node_add_update
      description: Creates a node with the given name. Requires the core process to
        be in the STOPPED state and a package archive to be present for the given
        node name. The core process can be stopped via the runtime control HTTP endpoint.
      parameters:
      - in: path
        name: name
        schema:
          type: string
        required: true
      tags:
      - manage
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManageAddNodeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ManageAddNodeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ManageAddNodeRequest'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManageResponse'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManageResponse'
          description: ''
        '400':
          description: No response body
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManageResponse'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManageResponse'
          description: ''
        '500':
          description: No response body
    delete:
      operationId: manage_node_add_destroy
      description: Deletes the node with the given name. Requires the core process
        to be in the STOPPED state. The core process can be stopped via the runtime
        control HTTP endpoint.
      parameters:
      - in: path
        name: name
        schema:
          type: string
        required: true
      tags:
      - manage
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManageResponse'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManageResponse'
          description: ''
        '500':
          description: No response body
  /manage/node/add/{name}/package/:
    put:
      operationId: manage_node_add_package_update
      description: Uploads a package archive for the node with the given name. The
        archive must have the file extension .tar.gz. Requires the core process to
        be in the STOPPED state. The core process can be stopped via the runtime control
        HTTP endpoint.
      parameters:
      - in: path
        name: name
        schema:
          type: string
        required: true
      tags:
      - manage
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadArchiveRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UploadArchiveRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UploadArchiveRequest'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManageResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManageResponse'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManageResponse'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManageResponse'
          description: ''
        '500':
          description: No response body
  /manage/node/connect/:
    put:
      operationId: manage_node_connect_update
      description: Connects two nodes. Requires the core process to be in the INITIAL
        state. The core process can be stopped via the runtime control HTTP endpoint.
      tags:
      - manage
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectNodeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ConnectNodeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ConnectNodeRequest'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectNodeResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectNodeResponse'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectNodeResponse'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectNodeResponse'
          description: ''
        '500':
          description: No response body
  /runtime/events/:
    get:
      operationId: runtime_events_retrieve
      description: Streams node events to the client as a server-sent event (SSE)
        stream.
      tags:
      - runtime
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            text/event-stream:
              schema:
                type: string
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeNodeEventResult'
          description: ''
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeNodeEventResult'
          description: ''
    post:
      operationId: runtime_events_create
      description: Processes an incoming node event and returns the result.
      tags:
      - runtime
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuntimeNodeEvent'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RuntimeNodeEvent'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RuntimeNodeEvent'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeNodeEventResult'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeNodeEventResult'
          description: ''
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeNodeEventResult'
          description: ''
  /schema/:
    get:
      operationId: schema_retrieve
      description: |-
        OpenApi3 schema for this API. Format can be selected via content negotiation.

        - YAML: application/vnd.oai.openapi
        - JSON: application/vnd.oai.openapi+json
      parameters:
      - in: query
        name: format
        schema:
          type: string
          enum:
          - json
          - yaml
      - in: query
        name: lang
        schema:
          type: string
          enum:
          - af
          - ar
          - ar-dz
          - ast
          - az
          - be
          - bg
          - bn
          - br
          - bs
          - ca
          - ckb
          - cs
          - cy
          - da
          - de
          - dsb
          - el
          - en
          - en-au
          - en-gb
          - eo
          - es
          - es-ar
          - es-co
          - es-mx
          - es-ni
          - es-ve
          - et
          - eu
          - fa
          - fi
          - fr
          - fy
          - ga
          - gd
          - gl
          - he
          - hi
          - hr
          - hsb
          - ht
          - hu
          - hy
          - ia
          - id
          - ig
          - io
          - is
          - it
          - ja
          - ka
          - kab
          - kk
          - km
          - kn
          - ko
          - ky
          - lb
          - lt
          - lv
          - mk
          - ml
          - mn
          - mr
          - ms
          - my
          - nb
          - ne
          - nl
          - nn
          - os
          - pa
          - pl
          - pt
          - pt-br
          - ro
          - ru
          - sk
          - sl
          - sq
          - sr
          - sr-latn
          - sv
          - sw
          - ta
          - te
          - tg
          - th
          - tk
          - tr
          - tt
          - udm
          - ug
          - uk
          - ur
          - uz
          - vi
          - zh-hans
          - zh-hant
      tags:
      - schema
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/vnd.oai.openapi:
              schema:
                type: object
                additionalProperties: {}
            application/yaml:
              schema:
                type: object
                additionalProperties: {}
            application/vnd.oai.openapi+json:
              schema:
                type: object
                additionalProperties: {}
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
components:
  schemas:
    ConnectNodeRequest:
      type: object
      description: |-
        Deserializes a connect-node request.

        Fields:
            source_name: The name of the source node.
            target_name: The name of the target node.
      properties:
        source_name:
          type: string
          maxLength: 64
        target_name:
          type: string
          maxLength: 64
      required:
      - source_name
      - target_name
    ConnectNodeResponse:
      type: object
      description: |-
        Serializes the result of a connect-node operation.

        Fields:
            result: Indicates whether the operation was successful.
            description: Human-readable description of the outcome.
      properties:
        result:
          type: boolean
        description:
          type: string
          maxLength: 64
      required:
      - description
      - result
    CoreState:
      type: object
      description: |-
        Serializes the current state of the pluto_core process.

        Fields:
            state: The current state as a string value of CoreState.
      properties:
        state:
          type: string
      required:
      - state
    ManageAddNodeRequest:
      type: object
      description: |-
        Deserializes an add-node request.

        Fields:
            top_level_package_name: The top-level Python package name of the node (max 64 characters).
      properties:
        top_level_package_name:
          type: string
          maxLength: 64
      required:
      - top_level_package_name
    ManageResponse:
      type: object
      description: |-
        Serializes the result of a node management operation.

        Fields:
            result: Indicates whether the operation was successful.
            description: Human-readable description of the outcome.
      properties:
        result:
          type: boolean
        description:
          type: string
          maxLength: 64
      required:
      - description
      - result
    NodeConnection:
      type: object
      description: |-
        Serializes a connection between two nodes.

        Fields:
            source: The name of the source node.
            target: The name of the target node.
      properties:
        source:
          type: string
        target:
          type: string
      required:
      - source
      - target
    NodeStructure:
      type: object
      description: |-
        Serializes the current node structure.

        Fields:
            result: Indicates whether the operation was successful.
            description: Human-readable description of the outcome.
            nodes: Names of all defined nodes.
            connections: List of connections between nodes.
      properties:
        result:
          type: boolean
        description:
          type: string
        nodes:
          type: array
          items:
            type: string
        connections:
          type: array
          items:
            $ref: '#/components/schemas/NodeConnection'
      required:
      - connections
      - description
      - nodes
      - result
    RuntimeNodeEvent:
      type: object
      description: |-
        Deserializes an incoming node event from JSON.

        Fields:
            id: Unique identifier of the node (0–4294967295).
            event_id: Identifier of the event type (0–4294967295).
            timestamp: ISO 8601 formatted timestamp of the event.
            payload: Base64-encoded event payload. May be empty.
      properties:
        id:
          type: integer
          maximum: 4294967295
          minimum: 0
          format: int64
        event_id:
          type: integer
          maximum: 4294967295
          minimum: 0
          format: int64
        timestamp:
          type: string
          format: date-time
        payload:
          type: string
      required:
      - event_id
      - id
      - payload
      - timestamp
    RuntimeNodeEventResult:
      type: object
      description: |-
        Serializes the result of a node event processing operation.

        Fields:
            result: Indicates whether the operation was successful.
            description: Human-readable description of the outcome.
      properties:
        result:
          type: boolean
        description:
          type: string
      required:
      - description
      - result
    UploadArchiveRequest:
      type: object
      description: |-
        Deserializes an upload-archive request.

        Fields:
            content: The base64-encoded binary content of the package archive.
      properties:
        content:
          type: string
      required:
      - content
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
